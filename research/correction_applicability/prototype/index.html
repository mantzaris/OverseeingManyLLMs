<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Decision desk - scoped corrections</title>
<style>
:root{font:16px system-ui;color:#173440;background:#f2f6f8}body{margin:0}header{background:#173e4c;color:white;padding:24px 5vw}h1{margin:0;font-size:27px}header p{margin-bottom:0}main{max-width:1300px;margin:24px auto;padding:0 24px}button,select{font:inherit;padding:10px;border-radius:6px;border:1px solid #bcced7}button{background:#096b70;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.layout{display:grid;grid-template-columns:370px 1fr;gap:22px}.card{background:white;border:1px solid #cddde5;border-radius:9px;padding:20px;margin-bottom:16px}h2{font-size:21px;margin-top:0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}.answers .card{margin:0}.value{font-size:23px;font-weight:650;color:#00636b;overflow-wrap:anywhere}.muted{color:#526e7c;font-size:14px}.tag{font-size:13px;background:#edf5f2;padding:4px 7px;display:inline-block;border-radius:3px}.rejected{background:#fff0d7;color:#745122}pre{font:13px ui-monospace;white-space:pre-wrap;overflow-wrap:anywhere}summary{cursor:pointer;color:#155773}table{border-collapse:collapse;font-size:13px;width:100%}td{padding:6px;border:1px solid #cbdae1}.source{max-height:450px;overflow:auto}.notice{border-left:4px solid #ca963e;padding:10px 14px;background:#fff8e9;margin-bottom:20px}@media(max-width:900px){.layout{grid-template-columns:1fr}.answers{grid-template-columns:1fr}}
</style>
<header><h1>Decision desk</h1><p>Inspect one answer. Keep a correction within its supported scope.</p></header><main><div class="notice">Recorded replay · Real financial-report source, benchmark questions and simulated inspections. Changes shown here are saved model outputs.</div><div class="bar"><label>Source <select id="source"></select></label><label>Method <select id="method"><option value="patch">Constrained correction</option><option value="individual">Individual correction</option><option value="execute">Execution only</option><option value="verify">Source verification</option><option value="reattempt">Ordinary reattempt</option><option value="coarse">Coarse correction transfer</option><option value="no_applicability">Without applicability checks</option></select></label><button id="open">Open replay</button><span id="status"></span></div><div class="layout"><aside id="review"></aside><div><div id="answers" class="answers"></div><div class="card" style="margin-top:18px"><details open><summary>Shared source evidence</summary><div id="evidence" class="source"></div></details></div></div></div></main>
<script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state;
const post=async(path,p)=>{let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let d=await r.json();if(!r.ok)throw Error(d.error);return d};
const reasonText=r=>({'local_or_unsupported_patch':'The inspected answer does not support a reusable correction.','missing_donor_representation':'A reliable before-and-after computation is missing.','corrected_donor_contract':'The proposed explanation failed a source or question check.','percentage_expression':'The computation does not express the required percentage change.','period_binding':'The selected cells do not support the requested periods.','no_source_dependency':'This answer does not use the source element being corrected.','source_version':'The source has changed. Revalidation is required.','unsupported_recipient':'This answer has no supported computation to patch.'}[r]||r.replaceAll('_',' '));
const calculation=a=>a?.rep?`${a.rep.expression}  [${(a.rep.refs||[]).join(', ')}]`:'No supported computation';
function show(s){state=s;document.querySelector('#status').textContent=`${s.remaining} / 2 inspections remaining`;let q=s.next_question;let last=s.last;let p=last?.patch;
 document.querySelector('#review').innerHTML=`<div class="card"><h2>${q?'Next inspection':'Inspection session complete'}</h2><p>${q?esc(q.question):'Other outputs remain visible. Their correctness has not been certified.'}</p>${q?'<p class="muted">Chosen by the fixed risk ranking. The same questions are inspected in every method.</p><button id="inspect">Reveal recorded correction</button>':''}</div>`+(last?`<div class="card"><h2>Correction obtained</h2><p>${esc(last.disclosure.question)}</p><p class="value">${esc(last.disclosure.answer)} ${esc(last.disclosure.scale)}</p><span class="tag">Verified for this question only</span>${p?`<h3>Proposed scope</h3><p>${p.supported?esc(p.kind.replaceAll('_',' ')):'No reusable computation change is supported.'}</p><p>${esc((p.generalizes||[]).join('; '))}</p><p class="muted">${esc(p.reasons.map(reasonText).join(' '))}</p><details><summary>Patch and provenance</summary><pre>${esc(JSON.stringify(p,null,2))}</pre></details>`:''}</div>`:'');
 document.querySelector('#answers').innerHTML=s.questions.map(q=>{let a=s.answers[q.id];let e=last?.revisions.find(x=>x.recipient===q.id);return `<div class="card"><span class="tag">${q.id===last?.inspected?'Inspected answer':'Agent answer'}</span><p>${esc(q.question)}</p><p class="value">${esc((a.answer||[]).join(' / '))} ${esc(a.scale)}</p>${e?`<span class="tag ${e.accepted?'':'rejected'}">${e.accepted?'Candidate committed':'Original retained'}</span><p class="muted">${esc(e.reasons.map(reasonText).join(' '))}</p><details open><summary>Before and candidate</summary><p>Before: ${esc(e.before.answer)} ${esc(e.before.scale)}</p><pre>${esc(calculation(e.before))}</pre><p>Candidate: ${e.candidate?esc(e.candidate.answer)+' '+esc(e.candidate.scale):'No supported candidate'}</p><pre>${esc(calculation(e.candidate))}</pre></details>`:`<p class="muted">${q.id===last?.inspected?'Direct verified replacement.':'No committed correction shown for this output.'}</p>`}<details><summary>Computation details</summary><pre>${esc(JSON.stringify(a.rep,null,2))}</pre></details></div>`}).join('');
 document.querySelector('#evidence').innerHTML='<table>'+s.source.table.map((r,i)=>'<tr><td>T'+i+'</td>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</table>'+s.source.paragraphs.map(p=>'<p><b>P'+p.order+'</b> '+esc(p.text)+'</p>').join('');document.querySelector('#inspect')?.addEventListener('click',async()=>show(await post('/api/inspect',{session:s.session})));
}
document.querySelector('#open').onclick=async()=>show(await post('/api/open',{index:Number(document.querySelector('#source').value),method:document.querySelector('#method').value}));fetch('/api/catalog').then(r=>r.json()).then(cs=>{document.querySelector('#source').innerHTML=cs.map(c=>`<option value="${c.index}">Group ${c.index+1} · ${c.questions} questions</option>`).join('');if(cs.length)document.querySelector('#open').click()});
</script>
